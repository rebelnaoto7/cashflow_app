<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}月次資金繰り＋3ヶ月予測{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    :root { --brand:#1F4E78; }
    body { font-family: "Meiryo UI","Meiryo",-apple-system,"Segoe UI",sans-serif; background:#f5f6f8; }
    .app-title { color: var(--brand); font-weight: 700; }
    .sidebar { background:#fff; border-right:1px solid #e3e6ea; min-height:100vh; }
    .sidebar .accordion-button { font-size:.9rem; padding:.6rem .8rem; }
    .sidebar label { font-size:.8rem; margin-bottom:.15rem; }
    .sidebar .mb-2 { margin-bottom:.5rem !important; }
    .kpi-card { background:#fff; border-radius:.6rem; padding:1rem; box-shadow:0 1px 3px rgba(0,0,0,.08); height:100%; }
    .kpi-card .kpi-label { color:#6c757d; font-size:.82rem; }
    .kpi-card .kpi-value { font-size:1.5rem; font-weight:700; color:#212529; }
    .kpi-card .kpi-delta.up { color:#198754; }
    .kpi-card .kpi-delta.down { color:#dc3545; }
    /* 計画表の行スタイル（Streamlit Styler 相当） */
    table.cf-table { font-size:.85rem; }
    table.cf-table td, table.cf-table th { text-align:right; white-space:nowrap; vertical-align:middle; }
    table.cf-table td:first-child, table.cf-table th:first-child { text-align:left; position:sticky; left:0; }
    .row-final td { background:#1F4E78 !important; color:#fff; font-weight:700; font-size:1.02em; }
    .row-major td { background:#2E75B6 !important; color:#fff; font-weight:700; }
    .row-cat   td { background:#5B9BD5 !important; color:#fff; font-weight:700; }
    .row-open  td { background:#404040 !important; color:#FFD966; font-weight:700; }
    .eval-good { background:#C6EFCE; color:#006100; font-weight:700; }
    .eval-warn { background:#FFEB9C; color:#9C5700; font-weight:700; }
    .eval-bad  { background:#F8CBAD; color:#9C0006; font-weight:700; }
    .actual-grid input { width:100%; text-align:right; border:1px solid #ced4da; border-radius:.25rem; padding:.2rem .4rem; font-size:.85rem; }
    .nav-tabs .nav-link.active { color:var(--brand); font-weight:700; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
